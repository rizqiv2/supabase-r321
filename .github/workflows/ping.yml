name: Supabase Keep-Alive

on:
  schedule:
    # Berjalan otomatis setiap 3 hari pukul 06:00 UTC (13:00 WIB)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Bisa dijalankan manual kapan saja

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send Query to Supabase PostgREST
        run: |
          TABLE_NAME="${{ secrets.SUPABASE_TABLE }}"
          if [ -z "$TABLE_NAME" ]; then
            TABLE_NAME="battery_telemetry"
          fi

          echo "Pinging table: $TABLE_NAME"

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/${TABLE_NAME}?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          echo "HTTP Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Success! Supabase PostgreSQL activity recorded."
          else
            echo "Failed with HTTP $HTTP_STATUS"
            exit 1
          fi
