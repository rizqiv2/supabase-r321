name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 06:00 UTC (13:00 WIB)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send Query to Supabase PostgREST
        run: |
          TABLE_NAME="${{ secrets.SUPABASE_TABLE }}"
          if [ -z "$TABLE_NAME" ]; then
            TABLE_NAME="battery_telemetry"
          fi

          echo "Target Table: $TABLE_NAME"
          echo "Pinging Supabase database..."

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/${TABLE_NAME}?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Success! PostgreSQL activity recorded. Inactivity timer reset."
          else
            echo "Failed: Non-200 status code received."
            exit 1
          fi
